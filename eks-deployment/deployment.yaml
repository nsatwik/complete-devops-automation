#Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mypod
  labels:
    app: mypod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mypod
  template:
    metadata:
      labels:
        app: mypod
    spec:
      containers:
        - name: cont1
          image: 815018697163.dkr.ecr.ap-south-1.amazonaws.com/hello:11-132e0e9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: ENV
              value: "dev"
-------------------------------------------------------------
#Service
apiVersion: v1
kind: Service
metadata:
  name: mypod-svc
  labels:
    app: mypod
spec:
  type: ClusterIP
  selector:
    app: mypod
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
